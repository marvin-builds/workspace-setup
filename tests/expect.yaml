# What a set-up machine must look like. chezmoi renders this, filtered by
# OS, role and form, to ~/.config/ws/expect.tsv (home/dot_config/ws/), and
# `ws doctor` checks the machine against that file.
#
# Format (validated by tests/unit/expect-yaml.bats):
#
#   checks:            a list; each entry has
#     id               unique, [a-z0-9-]+
#     exactly one kind:
#       command: <name>              on PATH; optional
#         smoke: <command line>      must exit 0
#         source: <path>             the resolved command must be this path
#       file: <path>                 exists
#       absent: <path>               doesn't exist
#       line: {file: <path>, text: <fixed string>, count: <n>}
#                                    exactly n lines of the file equal text
#     optional filters (lists; missing means all):
#       os: [linux, darwin, windows]
#       roles: [personal, work]
#       forms: [desktop, headless, wsl, container]
#
# Paths may start with ~/. No value may contain a tab or a newline.

checks:
  - id: chezmoi
    command: chezmoi
    source: ~/.local/bin/chezmoi
    smoke: chezmoi --version

  - id: git
    command: git
    smoke: git --version

  - id: ws
    command: ws
    source: ~/.local/bin/ws

  - id: git-config
    file: ~/.config/git/config

  - id: expect-tsv
    file: ~/.config/ws/expect.tsv

  # Shell base (slice 4). Linux only: Git Bash comes with the Windows phase.
  - id: bashrc
    os: [linux]
    file: ~/.bashrc

  # ~/.local/bin is in PATH exactly once in a new interactive bash and in a
  # bash started from it. The check is exported as a function, so the nested
  # shell runs it after its own ~/.bashrc. bash starts in a clean
  # environment, so this checks the bashrc, not the caller's PATH (a login
  # shell has ~/.local/bin twice through Ubuntu's ~/.profile).
  - id: shell-path
    os: [linux]
    command: bash
    smoke: 'env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=dumb bash -ic ''ws_path_once() { [ "$(printf "%s\n" "$PATH" | tr : "\n" | grep -cxF "$HOME/.local/bin")" = 1 ]; }; ws_path_once && export -f ws_path_once && bash -ic ws_path_once'''

  # Starts in vi mode, so only ~/.bashrc can turn emacs mode on.
  - id: shell-emacs
    os: [linux]
    command: bash
    smoke: bash -o vi -ic 'shopt -qo emacs'

  # Marker blocks the old setup repo wrote into rc files; the migration
  # script removes them (a missing file counts as 0).
  - id: old-block-ai-workspace-bashrc
    os: [linux]
    line: {file: ~/.bashrc, text: "# >>> ai-workspace >>>", count: 0}

  - id: old-block-ai-workspace-zshrc
    os: [linux]
    line: {file: ~/.zshrc, text: "# >>> ai-workspace >>>", count: 0}

  - id: old-block-yazi-bashrc
    os: [linux]
    line: {file: ~/.bashrc, text: "# >>> yazi-setup: y function >>>", count: 0}

  - id: old-block-yazi-zshrc
    os: [linux]
    line: {file: ~/.zshrc, text: "# >>> yazi-setup: y function >>>", count: 0}

  - id: old-block-lazygit-bashrc
    os: [linux]
    line: {file: ~/.bashrc, text: "# >>> lazygit-setup: lg >>>", count: 0}

  - id: old-block-lazygit-zshrc
    os: [linux]
    line: {file: ~/.zshrc, text: "# >>> lazygit-setup: lg >>>", count: 0}

  # Packages (slice 5): apt installs them to /usr/bin, so a copy elsewhere
  # on PATH doesn't pass. Ids are pkg-<logical name in packages.yaml>; the
  # all-OS `git` check above stays, pkg-git adds the Linux source.
  - id: pkg-git
    os: [linux]
    command: git
    source: /usr/bin/git
    smoke: git --version

  - id: pkg-gh
    os: [linux]
    command: gh
    source: /usr/bin/gh
    smoke: gh --version

  - id: pkg-ripgrep
    os: [linux]
    command: rg
    source: /usr/bin/rg
    smoke: rg --version

  - id: pkg-fzf
    os: [linux]
    command: fzf
    source: /usr/bin/fzf
    smoke: fzf --version

  - id: pkg-glow
    os: [linux]
    command: glow
    source: /usr/bin/glow
    smoke: glow --version

  - id: pkg-file
    os: [linux]
    command: file
    source: /usr/bin/file
    smoke: file --version

  # mise from its apt repo (slice 6), unpinned: it updates with apt.
  - id: pkg-mise
    os: [linux]
    command: mise
    source: /usr/bin/mise
    smoke: mise --version

  # Third-party apt repos: keyring and deb822 sources, ws-<repo name>.
  - id: apt-keyring-github-cli
    os: [linux]
    file: /etc/apt/keyrings/ws-github-cli.gpg

  - id: apt-sources-github-cli
    os: [linux]
    file: /etc/apt/sources.list.d/ws-github-cli.sources

  - id: apt-keyring-charm
    os: [linux]
    file: /etc/apt/keyrings/ws-charm.gpg

  - id: apt-sources-charm
    os: [linux]
    file: /etc/apt/sources.list.d/ws-charm.sources

  - id: apt-keyring-mise
    os: [linux]
    file: /etc/apt/keyrings/ws-mise.gpg

  - id: apt-sources-mise
    os: [linux]
    file: /etc/apt/sources.list.d/ws-mise.sources

  # Runtimes and tools from mise (slice 6). Each resolves, in a new
  # interactive bash with a clean environment (like shell-path), to a
  # binary under mise's install dir and runs; a same-named binary elsewhere
  # on PATH (e.g. a cargo yazi in ~/.cargo/bin) fails the check. Shims
  # don't count: they are out of scope.
  - id: mise-node
    os: [linux]
    command: bash
    smoke: 'env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=dumb bash -ic ''case "$(command -v node)" in "$HOME"/.local/share/mise/installs/*) node --version ;; *) exit 1 ;; esac'''

  - id: mise-python
    os: [linux]
    command: bash
    smoke: 'env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=dumb bash -ic ''case "$(command -v python)" in "$HOME"/.local/share/mise/installs/*) python --version ;; *) exit 1 ;; esac'''

  - id: mise-uv
    os: [linux]
    command: bash
    smoke: 'env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=dumb bash -ic ''case "$(command -v uv)" in "$HOME"/.local/share/mise/installs/*) uv --version ;; *) exit 1 ;; esac'''

  - id: mise-starship
    os: [linux]
    command: bash
    smoke: 'env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=dumb bash -ic ''case "$(command -v starship)" in "$HOME"/.local/share/mise/installs/*) starship --version ;; *) exit 1 ;; esac'''

  - id: mise-yazi
    os: [linux]
    command: bash
    smoke: 'env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=dumb bash -ic ''case "$(command -v yazi)" in "$HOME"/.local/share/mise/installs/*) yazi --version ;; *) exit 1 ;; esac'''

  - id: mise-ya
    os: [linux]
    command: bash
    smoke: 'env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=dumb bash -ic ''case "$(command -v ya)" in "$HOME"/.local/share/mise/installs/*) ya --version ;; *) exit 1 ;; esac'''

  # The node major and python minor of home/dot_config/mise/config.toml
  # (tests/unit/mise-data.bats keeps these in step with the config), so a
  # stale or hand-installed version fails.
  - id: mise-versions
    os: [linux]
    command: bash
    smoke: 'env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=dumb bash -ic ''case "$(node --version)" in v26.*) ;; *) exit 1 ;; esac; case "$(python --version 2>&1)" in "Python 3.14."*) ;; *) exit 1 ;; esac'''

  # mise's install dirs are in PATH, each once, in a new interactive bash,
  # after re-sourcing the bashrc and in a nested bash (as shell-path).
  - id: mise-path-once
    os: [linux]
    command: bash
    smoke: 'env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=dumb bash -ic ''ws_mise_once() { p=$(printf "%s\n" "$PATH" | tr : "\n" | grep -F "$HOME/.local/share/mise/installs/"); [ -n "$p" ] && [ -z "$(printf "%s\n" "$p" | sort | uniq -d)" ]; }; ws_mise_once && . ~/.bashrc && ws_mise_once && export -f ws_mise_once && bash -ic ws_mise_once'''
